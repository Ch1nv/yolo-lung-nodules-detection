# Description:
#   Automatic + manual deployment for the Cloud Run API.
#   Runs automatically when API code, the API Dockerfile, or API dependencies change on main.
#   Use this when the FastAPI upload/prediction proxy changes. This does not start GPU billing.
name: Deploy Cloud Run API
run-name: Deploy Cloud Run API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "docker/api.Dockerfile"
      - "requirements-api.txt"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE }}
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
      VERTEX_ENDPOINT_ID: ${{ vars.VERTEX_ENDPOINT_ID }}
      UPLOAD_BUCKET: ${{ vars.UPLOAD_BUCKET }}
      RESULT_BUCKET: ${{ vars.RESULT_BUCKET }}
      CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -f docker/api.Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${CLOUD_RUN_SERVICE_ACCOUNT}" \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars="GCP_PROJECT=${PROJECT_ID},VERTEX_LOCATION=${VERTEX_LOCATION},VERTEX_ENDPOINT_ID=${VERTEX_ENDPOINT_ID},UPLOAD_BUCKET=${UPLOAD_BUCKET},RESULT_BUCKET=${RESULT_BUCKET}" \
            --allow-unauthenticated
